<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Candidate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-size: 0.9rem; }
        .navbar { background-color: #212529 !important; border-bottom: 3px solid #198754; } 
        .nav-link { font-weight: 500; transition: 0.3s; }
        .active-nav { border-bottom: 2px solid #198754; color: #fff !important; }
        .card { border: none; border-radius: 12px; }
        .form-label { font-weight: 600; color: #495057; }
        .preview-box { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px dashed #ddd; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/admin/users}">
                <i class="bi bi-shield-lock-fill me-2"></i>OVS Admin Panel
            </a>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i>User List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active-nav text-white" th:href="@{/admin/add-candidate}">
                            <i class="bi bi-person-plus me-1"></i> Add Candidate
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning" th:href="@{/admin/results}"><i class="bi bi-bar-chart-line me-1"></i>Live Results</a>
                    </li>
                </ul>
                <a th:href="@{/login}" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0"><i class="bi bi-person-badge-fill me-2"></i>New Candidate</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/add-candidate}" method="post" enctype="multipart/form-data">
                            
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-white"><i class="bi bi-person text-success"></i></span>
                                    <input type="text" name="name" class="form-control" placeholder="Enter candidate name" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Political Party</label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-white"><i class="bi bi-flag text-success"></i></span>
                                    <input type="text" name="party" class="form-control" placeholder="Enter party name" required>
                                </div>
                            </div>

                            <div class="mb-4 text-center">
                                <label class="form-label d-block text-start">Candidate Photo</label>
                                <img id="imagePreview" src="#" alt="Preview" class="preview-box mx-auto shadow-sm">
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-white"><i class="bi bi-image text-success"></i></span>
                                    <input type="file" name="photo" id="photoInput" class="form-control" accept="image/*" required onchange="previewImage(this)">
                                </div>
                                <div class="form-text x-small mt-2">Accepted formats: JPG, PNG. Max size: 2MB.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success py-2 fw-bold shadow-sm">
                                    <i class="bi bi-check-circle-fill me-2"></i>Save Candidate
                                </button>
                                <a th:href="@{/admin/users}" class="btn btn-link btn-sm text-decoration-none text-muted">
                                    Cancel and Return
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.style.display = 'none';
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
