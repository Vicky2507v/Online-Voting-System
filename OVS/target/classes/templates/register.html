<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Registration - OVS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-size: 0.9rem; /* Smaller base font */
        }
        .register-card {
            border: none;
            border-radius: 10px;
        }
        .register-header {
            background: #0d6efd;
            color: white;
            padding: 1rem;
            border-radius: 10px 10px 0 0;
        }
        .form-control, .form-select {
            padding: 0.4rem 0.75rem; /* Reduced padding for smaller height */
        }
        .btn-register {
            padding: 0.5rem;
            font-weight: 600;
        }
        label {
            margin-bottom: 2px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .input-group-text {
            padding: 0.4rem 0.75rem;
        }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card register-card shadow">
                <div class="register-header text-center">
                    <h4 class="mb-0">Voter Registration</h4>
                </div>
                <div class="card-body p-3 p-md-4">
                    
                    <form th:action="@{/register}" method="post">
                        
                        <div class="mb-2">
                            <label class="text-muted">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="name" class="form-control" placeholder="Enter Name" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="text-muted">DOB</label>
                                <input type="date" name="dob" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="text-muted">Gender</label>
                                <select name="gender" class="form-select" required>
                                    <option value="" selected disabled>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="text-muted">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                                    <input type="text" name="phoneNumber" class="form-control" placeholder="Phone" required>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="text-muted">Aadhar No</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                    <input type="text" name="aadharNo" class="form-control" placeholder="Aadhar" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="text-muted">Email ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="text-muted">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Create Password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-register w-100 shadow-sm">
                            Register Now
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <span class="small text-muted">Already registered? </span>
                        <a th:href="@{/login}" class="small text-primary fw-bold text-decoration-none">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
