<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Admin - User List</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container-fluid">
			<a class="navbar-brand fw-bold" th:href="@{/admin/users}">
				<i class="bi bi-shield-lock-fill me-2"></i>OVS Admin Panel
			</a>
			<div class="collapse navbar-collapse">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link text-white" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i>User
							List</a>
					</li>
					<li class="nav-item">
					    <a class="nav-link text-white" th:href="@{/admin/add-candidate}">
					        <i class="bi bi-person-plus me-1"></i> Add Candidate
					    </a>
					</li>
					<li class="nav-item">
						<a class="nav-link active-nav text-warning" th:href="@{/admin/results}"><i
								class="bi bi-bar-chart-line me-1"></i>Live Results</a>
					</li>
				</ul>
				<a th:href="@{/login}" class="btn btn-danger btn-sm">Logout</a>
			</div>
		</div>
	</nav>

	<div class="container">
		<div class="d-flex justify-content-between align-items-center">
			<h3>Registered Users</h3>
			<span class="badge bg-secondary" th:text="${users.size()} + ' Total Users'"></span>
		</div>
		<table class="table table-hover table-bordered mt-3 bg-white shadow-sm">
			<thead class="table-dark text-center">
				<tr>
					<th>Name</th>
					<th>Gender</th>
					<th>Aadhar Card No</th>
					<th>Email</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user : ${users}" class="text-center align-middle">
					<td th:text="${user.name}"></td>
					<td th:text="${user.gender}"></td>
					<td th:text="${user.aadharNo}"></td>
					<td th:text="${user.email}"></td>
					<td>
						<a th:href="@{'/admin/delete-user/' + ${user.id}}" class="btn btn-danger btn-sm"
							onclick="return confirm('Are you sure you want to remove this user? This action cannot be undone.')">
							<i class="bi bi-trash"></i> Remove
						</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
		<span th:text="${success}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	</div>
</body>

</html>
