<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OVS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        .login-card {
            border: none;
            border-radius: 12px;
        }
        .login-header {
            background: #198754; /* Success Green */
            color: white;
            padding: 1.2rem;
            border-radius: 12px 12px 0 0;
        }
        .form-control {
            padding: 0.5rem 0.75rem;
        }
        .btn-login {
            padding: 0.6rem;
            font-weight: 600;
            background-color: #198754;
            border: none;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #157347;
            transform: translateY(-1px);
        }
        label {
            margin-bottom: 3px;
            font-weight: 600;
            color: #495057;
        }
        .input-group-text {
            background-color: #ffffff;
            color: #198754;
        }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card login-card shadow-lg">
                <div class="login-header text-center">
                    <h4 class="mb-0"><i class="bi bi-shield-lock-fill me-2"></i>Voter Login</h4>
                </div>
                <div class="card-body p-4">
                    
                    <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>
                    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

                    <form th:action="@{/login}" method="post">
                        
                        <div class="mb-3">
                            <label>Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label>Password</label>
                                <a th:href="@{/forgot-password}" class="small text-decoration-none">Forgot?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-login w-100 shadow-sm mt-2">
                            Sign In
                        </button>
                    </form>

                    <div class="mt-4 text-center border-top pt-3">
                        <span class="text-muted small">Don't have an account? </span>
                        <a th:href="@{/register}" class="small fw-bold text-decoration-none text-success">Register Now</a>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <p class="text-muted x-small">Official Election Portal &copy; 2026</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
