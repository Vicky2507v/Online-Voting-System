<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password - OVS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        .recovery-card {
            border: none;
            border-radius: 12px;
        }
        .recovery-header {
            background: #0d6efd; 
            color: white;
            padding: 1.2rem;
            border-radius: 12px 12px 0 0;
        }
        .form-control {
            padding: 0.5rem 0.75rem;
        }
        .btn-recovery {
            padding: 0.6rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-recovery:hover {
            transform: translateY(-1px);
        }
        label {
            margin-bottom: 3px;
            font-weight: 600;
            color: #495057;
        }
        .input-group-text {
            background-color: #ffffff;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card recovery-card shadow-lg">
                <div class="recovery-header text-center">
                    <h4 class="mb-0"><i class="bi bi-patch-question-fill me-2"></i>Account Recovery</h4>
                </div>
                <div class="card-body p-4 text-center">
                    
                    <p class="text-muted small mb-4">Provide your registered email address, and we will send your password directly to your inbox.</p>
                    
                    <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>
                    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

                    <form th:action="@{/forgot-password}" method="post">
                        
                        <div class="mb-4 text-start">
                            <label>Email Address</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text"><i class="bi bi-envelope-at-fill"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-recovery w-100 shadow-sm">
                            <i class="bi bi-send-fill me-2"></i> Send Password
                        </button>
                    </form>

                    <div class="mt-4 border-top pt-3">
                        <a th:href="@{/login}" class="small text-decoration-none fw-bold">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <p class="text-muted small">Need help? Contact support@ovs.gov</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
