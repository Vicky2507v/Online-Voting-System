<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voter Dashboard - OVS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .candidate-card { transition: transform 0.3s; border: none; border-radius: 15px; }
        .candidate-card:hover { transform: translateY(-10px); }
        .party-logo { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #f8f9fa; }
        .navbar { background-color: #0d6efd !important; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-box-seam me-2"></i>Online Voting System</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" th:text="${user != null} ? 'Welcome, ' + ${user.name} : 'Welcome, Voter'"></span>
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm rounded-pill">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col text-center">
                <h2 class="fw-bold text-dark">Cast Your Vote</h2>
                <p class="text-muted">Please select your preferred candidate. You can only vote once per election.</p>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row mt-4">
            <div class="col-md-4 mb-4" th:each="candidate : ${candidates}">
                <div class="card candidate-card shadow-sm text-center p-3">
                    <img th:src="@{${candidate.photoPath}}" class="party-logo mx-auto mt-2 shadow-sm" alt="Candidate Photo">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark" th:text="${candidate.candidateName}"></h5>
                        <p class="badge bg-info text-dark rounded-pill px-3" th:text="${candidate.partyName}"></p>

                        <form th:action="@{/vote}" method="post">
                            <input type="hidden" name="candidateId" th:value="${candidate.id}">

                            <button type="submit" class="btn w-100 mt-3 rounded-pill fw-bold"
                                th:classappend="${user.hasVoted ? 'btn-secondary disabled' : 'btn-primary shadow-sm'}">
                                <span th:text="${user.hasVoted ? '✓ Already Voted' : 'Vote Now'}"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(candidates)}" class="text-center py-5">
                <i class="bi bi-person-x fs-1 text-muted"></i>
                <p class="text-muted mt-2">No candidates are currently registered for this election.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
